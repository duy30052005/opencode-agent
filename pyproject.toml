[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mycode-agent"
version = "1.0.0"
description = "Lightweight OpenCode Agent — AI-powered code generation & self-correction"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
  { name = "OpenCode Team", email = "team@opencode.dev" },
]
keywords = ["ai", "code-generation", "langgraph", "agent", "cli"]

dependencies = [
  "langgraph>=0.2",
  "langchain>=0.3",
  "langchain-google-genai>=2.0",
  "langchain-core>=0.3",
  "typer>=0.12",
  "rich>=13.0",
  "tree-sitter>=0.24",
  "tree-sitter-python>=0.24",
  "mcp>=1.0",
  "pydantic-settings>=2.0",
  "python-dotenv>=1.0",
]

[project.scripts]
mycode = "src.cli.app:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.setuptools.package-data]
"*" = ["*.md", "*.env.example"]
